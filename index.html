<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentFlow – Bản thử nghiệm banner | Innomation</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=IBM+Plex+Mono:wght@500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  /* Bố cục responsive: video phủ kín nền (object-fit: cover), lớp chữ và thẻ đặt theo viewport,
     kích thước thẻ tính bằng em từ một cỡ chữ gốc co giãn theo bề rộng màn hình. */
  :root{--blue:#001AAD;--cyan:#10CBFF;--ink:#171C2B;--gx:clamp(16px,5.5vw,96px)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,Arial,sans-serif;background:#05081A;color:#fff}

  /* Hero ghim trong lúc cuộn: đoạn cuộn 260 chiều cao màn hình dùng để chuyển ngày -> đêm */
  .hero-wrap{position:relative;height:260vh;height:260svh}
  .hero{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#000}
  .media{position:absolute;inset:0}
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 50%}
  .photo.night{opacity:0}
  .shade{position:absolute;inset:0;background:radial-gradient(ellipse 70vw 55vh at 0% 22%,rgba(0,10,50,.7),rgba(0,10,50,.32) 55%,rgba(0,10,50,0) 100%)}

  .nav{position:absolute;left:clamp(12px,2.8vw,40px);right:clamp(12px,2.8vw,40px);top:clamp(10px,2.2vh,24px);height:clamp(52px,6vw,64px);
    border-radius:16px;display:flex;align-items:center;gap:14px;padding:0 clamp(12px,1.6vw,22px) 0 clamp(14px,2vw,28px);z-index:5;
    background:rgba(255,255,255,.94);box-shadow:0 10px 30px rgba(0,0,0,.12);color:#2B3350}
  .nav img{height:clamp(18px,1.7vw,24px);width:auto;display:block}
  .nav ul{display:flex;gap:clamp(16px,2vw,30px);list-style:none;margin-left:clamp(20px,3.5vw,56px);font-size:14px;font-weight:600;white-space:nowrap}
  .nav li:first-child{color:var(--blue)}
  .nav .r{margin-left:auto;display:flex;align-items:center;gap:12px}
  .lang{display:flex;border:1px solid #D9E0F2;border-radius:999px;padding:3px}
  .lang button{font:700 12px Inter,Arial,sans-serif;padding:5px 10px;border-radius:999px;border:0;background:none;color:#4F587A;cursor:pointer}
  .lang button.on{background:var(--blue);color:#fff}
  .navcta{background:var(--blue);color:#fff;padding:12px 20px;font-size:13.5px;border-radius:999px;font-weight:700;white-space:nowrap}
  .burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid #D9E0F2;background:#fff;place-items:center}
  .burger i{display:block;width:16px;height:2px;background:#2B3350;box-shadow:0 5px 0 #2B3350,0 -5px 0 #2B3350}

  .lbl{display:inline-flex;align-items:center;gap:.6em;white-space:nowrap;padding:.42em .85em .42em .42em;border-radius:999px;background:rgba(8,12,30,.6);
    backdrop-filter:blur(8px);font:700 .885em 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.7em}
  .lbl .ic{width:1.75em;height:1.75em;border-radius:.5em;background:var(--blue);display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
  .lbl .av{width:1.9em;height:1.9em;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center}
  .lbl svg{width:55%;height:55%}

  .copy{position:absolute;left:var(--gx);top:clamp(120px,20vh,200px);width:min(760px,56vw);z-index:3;font-size:clamp(12px,1vw,16px)}
  .copy .lbl{margin-bottom:1.2em}
  .copy h1{font-size:clamp(34px,3.5vw,64px);line-height:1.1;font-weight:700;letter-spacing:-.02em}
  .copy h1 b{font-weight:700;background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .copy p{margin-top:.8em;max-width:31em;font-size:clamp(14px,1.05vw,18px);line-height:1.6;font-weight:500;color:rgba(255,255,255,.9)}
  .copy .meta{display:inline-block;margin-top:1.5em;padding:.4em .8em;border-radius:999px;background:rgba(8,12,30,.55);font:700 .8em 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
  .copy .meta i{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--cyan);margin-right:.6em;box-shadow:0 0 8px var(--cyan)}

  /* Hai cột thẻ: cột AI Agent bên phải, cột việc của người lệch xuống ngang ô thứ 3 */
  .cards{position:absolute;right:var(--gx);top:clamp(110px,17.5vh,190px);display:flex;align-items:flex-start;gap:2.2em;z-index:4;font-size:clamp(11px,.9vw,16px)}
  .humancol{position:relative;width:20em;margin-top:10em}
  .agent{width:21.5em}
  .tk{position:relative;display:flex;align-items:center;gap:.75em;margin-top:.46em;padding:0 .92em;height:3.08em;border-radius:.7em;font-weight:600;
    background:rgba(16,24,48,.62);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);overflow:hidden}
  .tk .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cb{width:1.38em;height:1.38em;border-radius:.38em;flex:none;display:grid;place-items:center;font-size:.85em;font-weight:800;color:#00163D;
    border:2px solid rgba(255,255,255,.45);transition:background .3s,border-color .3s,box-shadow .3s}
  .tk.run .cb{border-color:var(--cyan);box-shadow:0 0 10px rgba(16,203,255,.6)}
  .tk.done .cb{background:var(--cyan);border-color:var(--cyan)}
  .tk.queue{color:rgba(255,255,255,.7)}
  .tk .bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,rgba(16,203,255,.2),var(--cyan))}
  .tk.run .bar{width:100%;transition:width var(--d,2200ms) linear}
  .tk.done .bar{width:100%;opacity:0;transition:opacity .4s}
  .tk.enter{opacity:0;transform:translateY(12px)}
  .tk{transition:opacity .45s ease,transform .45s ease,height .45s ease,margin .45s ease}
  .tk.leave{opacity:0;height:0;margin-top:0;border-width:0}

  .agent .lblwrap{position:relative;height:2.92em}
  .agent .lblwrap .lbl{position:absolute;left:0;top:0}
  .clock{display:inline-block;margin-bottom:1.1em;font:700 1.15em Inter,Arial,sans-serif;padding:.45em .7em;border-radius:.45em;
    background:rgba(8,12,30,.8);border:1px solid rgba(255,255,255,.2);letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .clock small{font-size:.66em;opacity:.75;margin-left:.3em}
  .humans{position:relative}
  .human.night{position:absolute;left:0;top:0;width:100%}
  .human.night .tk{opacity:.6}

  .hint{position:absolute;left:50%;bottom:clamp(14px,3vh,26px);transform:translateX(-50%);font:700 11px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:4;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .hint i{width:2px;height:26px;background:linear-gradient(var(--cyan),transparent);animation:drip 1.6s ease-in-out infinite}
  @keyframes drip{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(.2);transform-origin:bottom}}

  /* Logo khách hàng nằm trên mép dưới banner */
  .marq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
  .track{display:flex;width:max-content;animation:marq 44s linear infinite}
  @keyframes marq{to{transform:translateX(-50%)}}
  .lg{flex:none;width:180px;height:66px;margin:0 18px;display:grid;place-items:center}
  .lg img{width:auto;max-width:160px;object-fit:contain}

  /* Màn hình vừa: menu rút gọn */
  @media (max-width:1180px){ .nav ul{display:none} .burger{display:grid} }

  /* Máy tính bảng / laptop nhỏ: thẻ gom thành một cột ở góc phải dưới */
  @media (max-width:1023px){
    .copy{width:min(620px,78vw)}
    .cards{top:auto;bottom:clamp(20px,5vh,56px);flex-direction:column;gap:1.2em;font-size:clamp(11px,1.45vw,14px)}
    .humancol{order:2;margin-top:0;width:21.5em}
    .clock{position:absolute;right:0;top:0;margin:0;font-size:1em}
    .hint{display:none}
    .shade{background:linear-gradient(180deg,rgba(0,10,50,.72) 0%,rgba(0,10,50,.25) 42%,rgba(0,10,50,.15) 55%,rgba(0,10,50,.7) 100%)}
  }

  /* Điện thoại: chữ ở trên, thẻ AI Agent trải ngang ở dưới, thẻ của người thu gọn */
  @media (max-width:640px){
    .lang{display:none}
    .navcta{padding:10px 14px;font-size:12px}
    .copy{top:calc(clamp(10px,2.2vh,24px) + 52px + 22px);width:auto;right:var(--gx)}
    .copy h1{font-size:clamp(28px,8.6vw,38px)}
    .copy p{font-size:14px}
    .copy .meta{font-size:10px;margin-top:1em}
    .cards{left:var(--gx);right:var(--gx);bottom:16px;font-size:12px}
    .cards{align-items:stretch}
    .agent,.humancol{width:100%}
    .human .tk ~ .tk{display:none}
    .burger{display:none}
    #feed .tk:nth-child(n+4){display:none}
  }
  /* Màn hình dọc: dời khung video sang trái để thấy cả người lẫn robot */
  @media (orientation:portrait){ .photo{object-position:30% 50%} }
  /* Màn hình thấp (điện thoại xoay ngang): bỏ bớt mô tả */
  @media (max-height:520px){ .copy p,.copy .meta{display:none} .humancol{display:none} #feed .tk:nth-child(n+3){display:none} }

  @media (prefers-reduced-motion:reduce){.track{animation:none}.tk,.tk.run .bar,.cb{transition:none}.hint i{animation:none}}
  /* ===== v2: nền sáng, một khuôn section, một sợi chuyện xuyên suốt ===== */
  :root{--bg:#F7F9FF;--line:#E3E8F5;--mute:#5A6482}
  .page{background:#fff;color:var(--ink)}
  .wrapx{max-width:1200px;margin:0 auto;padding:0 clamp(16px,3vw,40px)}
  .mono{font:600 12px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
  .btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--blue);text-decoration:none;padding:15px 26px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .2s}
  .btn.pri{background:var(--blue);color:#fff;box-shadow:0 14px 30px -14px rgba(0,26,173,.7)}.btn:hover{transform:translateY(-2px)}
  .herologos{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:70px 0 20px;background:linear-gradient(180deg,rgba(3,6,24,0),rgba(3,6,24,.78))}
  .herologos .lg img{filter:brightness(0) invert(1);opacity:.82}.hero .hint{bottom:118px}
  .logos{display:none;background:#fff;border-bottom:1px solid var(--line);padding:22px 0}.logos .lg img{filter:grayscale(1);opacity:.7}
  @media (max-width:1023px){.herologos{display:none}.logos{display:block}}

  .subnav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .subnav .wrapx{display:flex;align-items:center;justify-content:space-between;height:52px;gap:16px}
  .subnav .mono{font-size:11.5px;white-space:nowrap}
  .subnav nav{display:flex;gap:clamp(14px,3vw,40px);overflow-x:auto;scrollbar-width:none}
  .subnav nav a{color:#9AA3BF;text-decoration:none;white-space:nowrap;transition:color .25s}.subnav nav a b{color:var(--blue)}.subnav nav a.on{color:var(--ink)}

  .sec{padding:clamp(64px,7vw,112px) 0;border-bottom:1px solid var(--line);scroll-margin-top:52px}
  .sec.alt{background:var(--bg)}
  .head{max-width:820px;margin:0 auto;text-align:center}
  .story{display:inline-flex;align-items:center;gap:12px;padding:7px 16px 7px 12px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:13px;color:var(--mute);box-shadow:0 6px 18px -12px rgba(0,26,173,.4)}
  .story b{color:var(--ink);font-weight:600}.story .dots{display:flex;gap:4px}.story .dots i{width:16px;height:4px;border-radius:2px;background:#D5DEFA}.story .dots i.on{background:var(--blue)}
  .eyebrow{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:22px;font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
  .eyebrow b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;letter-spacing:0}
  .head h2,.cta2 h2{margin-top:14px;font-size:clamp(30px,3.6vw,52px);line-height:1.1;font-weight:700;letter-spacing:-.03em}
  .head h2 em{font-style:normal;color:var(--blue)}
  .lede{margin:18px auto 0;max-width:40em;font-size:17px;line-height:1.65;color:var(--mute)}
  .ctas{display:flex;justify-content:center;margin-top:28px}

  /* 01 Discover */
  .chatcard{display:grid;grid-template-columns:1fr 1.25fr;gap:0;margin:clamp(36px,4vw,56px) auto 0;max-width:1000px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 70px -40px rgba(0,26,173,.45);overflow:hidden}
  .cc{padding:clamp(22px,3vw,36px)}.cc.ag{background:linear-gradient(160deg,#F2F6FF,#E8EFFF);border-left:1px solid var(--line)}
  .cc .mono{color:var(--blue);font-size:11px}
  .bub{margin-top:16px;padding:16px 18px;border-radius:14px 14px 14px 4px;background:var(--blue);color:#fff;font-size:17px;line-height:1.5;font-weight:500}
  .who{margin-top:10px;font-size:13px;color:var(--mute)}
  .alist{display:grid;gap:10px;margin-top:16px}
  .arow{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:10px;background:#fff;border:1px solid #D5DEFA;font-size:14px;font-weight:600;opacity:0;animation:rise .5s ease forwards}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .arow .ck{flex:none;width:20px;height:20px;border-radius:6px;background:var(--cyan);display:grid;place-items:center;font-size:11px;font-weight:800;color:#00163D}
  .arow b{margin-left:auto;font:700 10px 'IBM Plex Mono',monospace;letter-spacing:.05em;color:#0A55C8;background:#E3F6FF;padding:4px 8px;border-radius:5px}
  .arow.wait .ck{background:#fff;border:2px solid #F0A93B}.arow.wait b{background:#FFF1DC;color:#8A5200}
  .why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);max-width:1000px;margin:clamp(40px,5vw,64px) auto 0}
  .why em{font:600 12px 'IBM Plex Mono',monospace;font-style:normal;color:var(--blue)}.why h4{margin-top:8px;font-size:18px;font-weight:600}.why p{margin-top:8px;font-size:14.5px;line-height:1.6;color:var(--mute)}

  /* 02 Visualize: tiêu đề và hai khung cùng được ghim */
  .vzwrap{height:190vh}
  .vzstick{position:sticky;top:60px;height:calc(100vh - 76px);min-height:480px;max-height:720px}
  .vzcol{height:100%;display:flex;flex-direction:column}
  .vzhead .head{max-width:none;display:flex;align-items:center;justify-content:space-between;gap:20px;text-align:left;margin-bottom:14px}
  .vzhead .story,.vzhead .eyebrow{display:none}
  .vzhead h2{margin:0!important;font-size:clamp(22px,2.6vw,36px)!important}
  .vzstage{position:relative;flex:1;min-height:0}
  .vzp{position:absolute;top:0;bottom:0;width:calc(50% - 8px);border-radius:16px;overflow:hidden;z-index:0}
  .vzp.l{left:0;background:#fff;border:1.5px dashed #C5D0EE}
  .vzp.r{right:0;background:#EEF3FF;border:1.5px solid #C9D6FF;transition:border-color .5s,box-shadow .5s}
  .vzp.r.lit{border-color:var(--blue);box-shadow:0 0 0 5px rgba(0,26,173,.08)}
  .vzlab{position:absolute;left:16px;top:16px;z-index:3;font:700 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;padding:6px 12px;border-radius:99px;background:#F1F3FA;color:var(--mute);transition:background .4s,color .4s}
  .vzlab.on{background:var(--blue);color:#fff}
  .vzp p{position:absolute;left:18px;right:18px;bottom:16px;font-size:13px;line-height:1.5;color:var(--mute)}
  .slot{position:absolute;z-index:0;border:1.5px dashed #9FB2EA;border-radius:10px}
  .vzline{position:absolute;z-index:0;width:0;border-left:2px dashed var(--blue);transform-origin:top}
  .vc{position:absolute;z-index:1;height:64px;border-radius:10px;background:#fff;border:1px solid #D5DEFA;color:var(--ink);box-shadow:0 10px 22px -12px rgba(0,26,173,.35);transition:background .45s,color .45s,border-color .45s}
  .vc.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .vc>div{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 12px}
  .vc span{font-size:clamp(11.5px,.95vw,13.5px);font-weight:600;line-height:1.3}
  .vc b{margin-left:auto;flex:none;font:700 9px 'IBM Plex Mono',monospace;letter-spacing:.05em;padding:3px 6px;border-radius:4px}
  .vc .cb1 b{color:#B04030;background:#FDE9E5}.vc .ca1 b{color:#fff;background:rgba(255,255,255,.2)}.vc .ca1 b.h{background:#fff;color:var(--blue)}
  .eras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:clamp(32px,4vw,56px)}
  .eras>div{padding:22px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .eras em{font:600 12px 'IBM Plex Mono',monospace;font-style:normal;color:#9AA3BF}.eras h4{margin-top:8px;font-size:17px;font-weight:600}.eras p{margin-top:8px;font-size:13.5px;line-height:1.55;color:var(--mute)}
  .eras .now{background:var(--blue);border-color:var(--blue);color:#fff}.eras .now em{color:var(--cyan)}.eras .now p{color:rgba(255,255,255,.8)}

  /* 03 Understand */
  .lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;margin-top:clamp(32px,4vw,52px)}
  .stack{display:grid;gap:10px}
  .stack button{display:flex;align-items:center;gap:14px;text-align:left;padding:18px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink);cursor:pointer;transition:all .25s}
  .stack button:hover{border-color:#9FB2EA}
  .stack em{font:700 12px 'IBM Plex Mono',monospace;font-style:normal;color:#9AA3BF;width:22px}
  .stack span{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#EEF2FF;color:var(--blue)}.stack span svg{width:18px;height:18px}
  .stack b{display:block;font-size:15.5px;font-weight:600}.stack small{display:block;margin-top:2px;font-size:12.5px;color:var(--mute)}
  .stack button.on{border-color:var(--blue);background:#F2F5FF;box-shadow:0 0 0 4px rgba(0,26,173,.08)}.stack button.on em{color:var(--blue)}
  .laypanel{display:flex;flex-direction:column;padding:clamp(24px,3vw,40px);border:1px solid var(--line);border-top:4px solid var(--cyan);border-radius:12px;background:#fff;box-shadow:0 24px 60px -36px rgba(0,26,173,.4);min-height:420px}
  .laypanel .mono{color:var(--blue);font-size:11px}.laypanel h3{margin-top:12px;font-size:clamp(22px,2.2vw,30px);font-weight:700;letter-spacing:-.02em}
  .laypanel p{margin-top:12px;font-size:15px;line-height:1.65;color:var(--mute)}
  .laypanel ul{list-style:none;margin-top:22px;display:grid;gap:10px}.laypanel li{padding:12px 14px;border-radius:8px;background:#EEF2FF;color:var(--blue);font-size:14px;font-weight:600}
  .req{position:relative;margin-top:auto;padding-top:34px}.req:before{content:"";position:absolute;left:0;right:0;top:12px;border-top:1.5px dashed #B9C4E6}
  .req i{position:absolute;top:6px;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px rgba(0,26,173,.15);transition:left .6s cubic-bezier(.3,.8,.3,1)}
  .req span{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}

  /* 04 Explore */
  .ltabs{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:clamp(28px,3vw,40px)}

    const vals = base.map((b, s) => Array.from({ length: N }, (_, i) => b * Math.pow(grow[s], i) * (1 + .12 * Math.sin(i * 1.3 + s))));
    const max = Array.from({ length: N }, (_, i) => vals.reduce((a, v) => a + v[i], 0)).reduce((a, b) => Math.max(a, b)) * 1.08;
    let acc = Array(N).fill(0), paths = '';
    vals.forEach((v, s) => {
      const lo = acc.slice(); acc = acc.map((a, i) => a + v[i]);
      const x = i => 30 + i * (W - 40) / (N - 1), y = val => H - 24 - val / max * (H - 40);
      const top = acc.map((a, i) => `${x(i)},${y(a)}`).join(' L'), bot = lo.map((a, i) => `${x(i)},${y(a)}`).reverse().join(' L');
      paths = `<path class="ar" d="M${top} L${bot} Z" fill="url(#p${s})" style="transition-delay:${s * .12}s"/>` + paths;
    });
    const pats = cols.map((c, s) => `<pattern id="p${s}" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="${c}" opacity=".55"/><circle cx="2" cy="2" r="1.1" fill="${c}"/></pattern>`).join('');
    const grid = [0, 1, 2, 3].map(g => `<line x1="30" x2="${W - 10}" y1="${16 + g * (H - 40) / 3}" y2="${16 + g * (H - 40) / 3}" stroke="#E6EBF7"/>`).join('');
    const mo = t.months.map((m, i) => `<text x="${30 + i * (W - 40) / 2}" y="${H - 4}" font-size="11" fill="#7A84A3" text-anchor="${['start', 'middle', 'end'][i]}" font-family="Inter">${m}</text>`).join('');
    return `<svg class="chart2" id="chart2" viewBox="0 0 ${W} ${H}"><defs>${pats}</defs>${grid}${paths}${mo}</svg>`;
  }

  // Visualize: hai khung. Thẻ tác vụ rời rạc bên trái trượt sang khung phải và xếp thành workflow khi cuộn
  const VZ = {
    d: { sx: [3, 8, 2, 9, 5], sy: [13, 27, 45, 58, 74], sr: [-4, 3, -2, 4, -3], sw: 40, tw: 40, tx: 55, ty: i => 15 + i * 16.5 },
    m: { sx: [3, 50, 3, 50, 26], sy: [11, 9, 25, 27, 39], sr: [-4, 3, 2, -3, 4], sw: 46, tw: 84, tx: 8, ty: i => 60 + i * 7.9 },
  };
  function vzUpdate() {
    const w = $('vzwrap'); if (!w) return;
    const clampv = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const sm = (a, b, v) => { const q = clampv((v - a) / (b - a)); return q * q * (3 - 2 * q) };
    const r = w.getBoundingClientRect();
    const lead = innerHeight * .5;   // hiệu ứng bắt đầu ngay khi khung hiện ra, không đợi tới lúc ghim
    const p = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : clampv((lead - r.top) / (lead + r.height - innerHeight));
    const mob = innerWidth < 900, C = mob ? VZ.m : VZ.d, e = sm(0, .62, p), lerp = (a, b) => a + (b - a) * e;
    const chips = [...document.querySelectorAll('#vzstage .vc')];
    chips.forEach((c, i) => {
      c.style.left = lerp(C.sx[i], C.tx) + '%'; c.style.top = lerp(C.sy[i], C.ty(i)) + '%'; c.style.width = lerp(C.sw, C.tw) + '%';
      c.style.transform = `rotate(${lerp(C.sr[i], 0)}deg)`;
      c.classList.toggle('on', p > .36);
      c.querySelector('.cb1').style.opacity = 1 - sm(.2, .34, p);
      c.querySelector('.ca1').style.opacity = sm(.38, .52, p);
    });
    const h = chips[0].offsetHeight;
    document.querySelectorAll('#vzstage .slot').forEach((sl, i) => { sl.style.left = C.tx + '%'; sl.style.top = C.ty(i) + '%'; sl.style.width = C.tw + '%'; sl.style.height = h + 'px'; sl.style.opacity = 1 - e });
    const ln = $('vzline');
    ln.style.left = (C.tx + C.tw / 2) + '%'; ln.style.top = `calc(${C.ty(0)}% + ${h / 2}px)`; ln.style.height = (C.ty(4) - C.ty(0)) + '%'; ln.style.transform = `scaleY(${e})`;
    const on = e > .55;
    $('vzlab').classList.toggle('on', on);
    document.querySelector('.vzp.r').classList.toggle('lit', on);
  }
  addEventListener('scroll', () => requestAnimationFrame(vzUpdate), { passive: true });
  addEventListener('resize', vzUpdate);


  function applyText() {
    const T = TEXT[lang];
    document.documentElement.lang = lang;
    $('menu').innerHTML = T.menu.map(m => `<li>${m}</li>`).join('');
    document.querySelectorAll('[data-k]').forEach(el => { el.textContent = T[el.dataset.k] });
    renderSections();
    $('b-vi').classList.toggle('on', lang === 'vi');
    $('b-en').classList.toggle('on', lang === 'en');
    resetFeed();
    update();
  }
  $('b-vi').onclick = () => { lang = 'vi'; applyText() };
  $('b-en').onclick = () => { lang = 'en'; applyText() };


  // ===== chuyển ngày -> đêm theo vị trí cuộn =====
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t) };
  // ?p=0..1 cố định tiến độ (dùng khi xuất ảnh minh hoạ)
  const FORCED = new URLSearchParams(location.search).get('p');
  function progress() {
    if (FORCED !== null) return clamp(+FORCED);
    const r = $('wrap').getBoundingClientRect();
    return clamp(-r.top / (r.height - innerHeight));
  }
  function update() {
    const p = progress();
    const e = smooth(.12, .88, p);                 // giữ ngày ở đầu, giữ đêm ở cuối
    $('night').style.opacity = e;
    // đồng hồ chạy từ 09:30 tới 23:00
    const mins = Math.round((570 + (1380 - 570) * e) / 5) * 5;
    const h = Math.floor(mins / 60), m = mins % 60;
    const ap = h < 12 ? 'AM' : 'PM';
    const hh = lang === 'en' ? ((h + 11) % 12) + 1 : h;
    $('clock').innerHTML = `${String(hh).padStart(2, '0')}:${String(m).padStart(2, '0')}<small>${ap}</small>`;
    // người về: thẻ việc ban ngày mờ dần, thẻ "đã về" hiện lên
    // mờ hẳn bản ngày rồi mới hiện bản đêm, tránh hai nhãn chồng lên nhau
    const out = smooth(.36, .48, e), inn = smooth(.5, .62, e);
    $('humanDay').style.opacity = 1 - out;
    $('humanNight').style.opacity = inn;
    $('agentDay').style.opacity = 1 - out;
    $('agentNight').style.opacity = inn;
    $('hint').style.opacity = 1 - smooth(0, .15, p);
  }
  addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
  addEventListener('resize', () => update());

  // ===== dòng việc AI Agent chạy liên tục =====
  const RUN = 1800, HOLD = 550, VISIBLE = 4;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let next = 0, timer = null;
  function row(state) {
    const T = TEXT[lang].tasks;
    const el = document.createElement('div');
    el.className = 'tk ' + state;
    el.innerHTML = `<span class="t">${T[next % T.length]}</span><span class="cb"></span><span class="bar"></span>`;
    el.style.setProperty('--d', RUN + 'ms');
    next++;
    return el;
  }
  function resetFeed() {
    clearTimeout(timer);
    const feed = $('feed');
    feed.innerHTML = '';
    next = 0;
    for (let i = 0; i < VISIBLE; i++) feed.appendChild(row(i === 0 ? 'queue' : 'queue'));
    if (reduce) { feed.firstChild.className = 'tk run'; return }
    timer = setTimeout(cycle, 400);
  }
  function cycle() {
    const feed = $('feed');
    const first = feed.firstElementChild;
    first.className = 'tk run';                     // thanh tiến độ chạy
    timer = setTimeout(() => {
      first.className = 'tk done';
      first.querySelector('.cb').textContent = '✓';
      timer = setTimeout(() => {
        first.classList.add('leave');               // thu gọn hàng đã xong
        const n = row('queue enter');
        feed.appendChild(n);
        n.getBoundingClientRect();                  // ép trình duyệt tính layout để hiệu ứng trượt vào chạy
        n.classList.remove('enter');
        timer = setTimeout(() => { first.remove(); cycle() }, 460);
      }, HOLD);
    }, RUN);
  }
  // tạm dừng khi tab ẩn để vòng lặp không dồn
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(timer); else resetFeed() });

  applyText();
</script>
</body>
</html>
