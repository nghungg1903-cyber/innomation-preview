<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentFlow – Bản thử nghiệm banner | Innomation</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  /* Bố cục responsive: video phủ kín nền (object-fit: cover), lớp chữ và thẻ đặt theo viewport,
     kích thước thẻ tính bằng em từ một cỡ chữ gốc co giãn theo bề rộng màn hình. */
  :root{--blue:#001AAD;--cyan:#10CBFF;--ink:#171C2B;--gx:clamp(16px,5.5vw,96px)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Montserrat,system-ui,sans-serif;background:#05081A;color:#fff}

  /* Hero ghim trong lúc cuộn: đoạn cuộn 260 chiều cao màn hình dùng để chuyển ngày -> đêm */
  .hero-wrap{position:relative;height:260vh;height:260svh}
  .hero{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#000}
  .media{position:absolute;inset:0}
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 50%}
  .photo.night{opacity:0}
  .shade{position:absolute;inset:0;background:radial-gradient(ellipse 70vw 55vh at 0% 22%,rgba(0,10,50,.7),rgba(0,10,50,.32) 55%,rgba(0,10,50,0) 100%)}

  .nav{position:absolute;left:clamp(12px,2.8vw,40px);right:clamp(12px,2.8vw,40px);top:clamp(10px,2.2vh,24px);height:clamp(52px,6vw,64px);
    border-radius:16px;display:flex;align-items:center;gap:14px;padding:0 clamp(12px,1.6vw,22px) 0 clamp(14px,2vw,28px);z-index:5;
    background:rgba(255,255,255,.94);box-shadow:0 10px 30px rgba(0,0,0,.12);color:#2B3350}
  .nav img{height:clamp(18px,1.7vw,24px);width:auto;display:block}
  .nav ul{display:flex;gap:clamp(16px,2vw,30px);list-style:none;margin-left:clamp(20px,3.5vw,56px);font-size:14px;font-weight:600;white-space:nowrap}
  .nav li:first-child{color:var(--blue)}
  .nav .r{margin-left:auto;display:flex;align-items:center;gap:12px}
  .lang{display:flex;border:1px solid #D9E0F2;border-radius:999px;padding:3px}
  .lang button{font:700 12px Montserrat,sans-serif;padding:5px 10px;border-radius:999px;border:0;background:none;color:#4F587A;cursor:pointer}
  .lang button.on{background:var(--blue);color:#fff}
  .navcta{background:var(--blue);color:#fff;padding:12px 20px;font-size:13.5px;border-radius:999px;font-weight:700;white-space:nowrap}
  .burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid #D9E0F2;background:#fff;place-items:center}
  .burger i{display:block;width:16px;height:2px;background:#2B3350;box-shadow:0 5px 0 #2B3350,0 -5px 0 #2B3350}

  .lbl{display:inline-flex;align-items:center;gap:.6em;white-space:nowrap;padding:.42em .85em .42em .42em;border-radius:999px;background:rgba(8,12,30,.6);
    backdrop-filter:blur(8px);font:700 .885em 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.7em}
  .lbl .ic{width:1.75em;height:1.75em;border-radius:.5em;background:var(--blue);display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
  .lbl .av{width:1.9em;height:1.9em;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center}
  .lbl svg{width:55%;height:55%}

  .copy{position:absolute;left:var(--gx);top:clamp(120px,20vh,200px);width:min(760px,56vw);z-index:3;font-size:clamp(12px,1vw,16px)}
  .copy .lbl{margin-bottom:1.2em}
  .copy h1{font-size:clamp(34px,3.5vw,64px);line-height:1.1;font-weight:700;letter-spacing:-.02em}
  .copy h1 b{font-weight:700;background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .copy p{margin-top:.8em;max-width:31em;font-size:clamp(14px,1.05vw,18px);line-height:1.6;font-weight:500;color:rgba(255,255,255,.9)}
  .copy .meta{display:inline-block;margin-top:1.5em;padding:.4em .8em;border-radius:999px;background:rgba(8,12,30,.55);font:700 .8em 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
  .copy .meta i{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--cyan);margin-right:.6em;box-shadow:0 0 8px var(--cyan)}

  /* Hai cột thẻ: cột AI Agent bên phải, cột việc của người lệch xuống ngang ô thứ 3 */
  .cards{position:absolute;right:var(--gx);top:clamp(110px,17.5vh,190px);display:flex;align-items:flex-start;gap:2.2em;z-index:4;font-size:clamp(11px,.9vw,16px)}
  .humancol{position:relative;width:20em;margin-top:10em}
  .agent{width:21.5em}
  .tk{position:relative;display:flex;align-items:center;gap:.75em;margin-top:.46em;padding:0 .92em;height:3.08em;border-radius:.7em;font-weight:600;
    background:rgba(16,24,48,.62);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);overflow:hidden}
  .tk .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cb{width:1.38em;height:1.38em;border-radius:.38em;flex:none;display:grid;place-items:center;font-size:.85em;font-weight:800;color:#00163D;
    border:2px solid rgba(255,255,255,.45);transition:background .3s,border-color .3s,box-shadow .3s}
  .tk.run .cb{border-color:var(--cyan);box-shadow:0 0 10px rgba(16,203,255,.6)}
  .tk.done .cb{background:var(--cyan);border-color:var(--cyan)}
  .tk.queue{color:rgba(255,255,255,.7)}
  .tk .bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,rgba(16,203,255,.2),var(--cyan))}
  .tk.run .bar{width:100%;transition:width var(--d,2200ms) linear}
  .tk.done .bar{width:100%;opacity:0;transition:opacity .4s}
  .tk.enter{opacity:0;transform:translateY(12px)}
  .tk{transition:opacity .45s ease,transform .45s ease,height .45s ease,margin .45s ease}
  .tk.leave{opacity:0;height:0;margin-top:0;border-width:0}

  .agent .lblwrap{position:relative;height:2.92em}
  .agent .lblwrap .lbl{position:absolute;left:0;top:0}
  .clock{display:inline-block;margin-bottom:1.1em;font:700 1.15em 'JetBrains Mono',monospace;padding:.45em .7em;border-radius:.45em;
    background:rgba(8,12,30,.8);border:1px solid rgba(255,255,255,.2);letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .clock small{font-size:.66em;opacity:.75;margin-left:.3em}
  .humans{position:relative}
  .human.night{position:absolute;left:0;top:0;width:100%}
  .human.night .tk{opacity:.6}

  .hint{position:absolute;left:50%;bottom:clamp(14px,3vh,26px);transform:translateX(-50%);font:700 11px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;
    color:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:4;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .hint i{width:2px;height:26px;background:linear-gradient(var(--cyan),transparent);animation:drip 1.6s ease-in-out infinite}
  @keyframes drip{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(.2);transform-origin:bottom}}

  /* ===== Các section dưới banner (nền sáng, bố cục theo kiểu Atomicwork) ===== */
  .page{background:#F7F9FF;color:var(--ink)}
  .wrapx{max-width:1240px;margin:0 auto;padding:0 var(--gx)}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font:700 12px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#2563EB}
  .eyebrow i{width:22px;height:2px;background:var(--cyan)}
  .sec{padding:clamp(64px,9vw,120px) 0}
  .sec h2{font-size:clamp(28px,3.4vw,48px);line-height:1.12;letter-spacing:-.02em;font-weight:700;color:var(--blue);margin-top:14px;max-width:18em}
  .sec .lead{margin-top:14px;max-width:44em;font-size:clamp(15px,1.15vw,18px);line-height:1.65;color:#4A5372;font-weight:500}

  /* Dải logo khách hàng */
  .logos{padding:44px 0 40px;border-bottom:1px solid #E3E8F6;background:#fff}
  .logos .cap{text-align:center;font:700 12px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#6B7490}
  .marq{margin-top:26px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .track{display:flex;width:max-content;animation:marq 38s linear infinite}
  .marq:hover .track{animation-play-state:paused}
  @keyframes marq{to{transform:translateX(-50%)}}
  .lg{flex:none;width:200px;height:64px;margin:0 22px;display:grid;place-items:center;filter:grayscale(1);opacity:.62;transition:filter .3s,opacity .3s;color:#1E2540}
  .lg:hover{filter:none;opacity:1}
  .lg img{max-width:150px;max-height:58px;object-fit:contain}
  .wm{font-family:Montserrat,sans-serif;text-align:center;line-height:1.1;white-space:nowrap}
  .wm.av{font-weight:500;font-size:22px;letter-spacing:.42em;padding-left:.42em}
  .wm.lof{font-weight:800;font-size:30px;letter-spacing:.04em}
  .wm.evn{font-weight:800;font-size:22px;letter-spacing:.02em}.wm.evn small{display:block;font-weight:600;font-size:11px;letter-spacing:.3em;margin-top:3px}
  .wm.dost{font-weight:700;font-size:12.5px;letter-spacing:.02em}.wm.dost b{display:block;font-size:19px;letter-spacing:.06em;margin-top:2px}
  .stats{display:flex;justify-content:center;gap:clamp(24px,6vw,90px);margin-top:34px;flex-wrap:wrap}
  .stat{text-align:center}
  .stat b{display:block;font-size:clamp(26px,2.6vw,36px);color:var(--blue);font-weight:700;letter-spacing:-.02em}
  .stat span{font-size:13px;color:#6B7490;font-weight:600}

  /* Năng lực theo phòng ban: tab trái, quy trình phải */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:36px}
  .tab{font:600 14px Montserrat,sans-serif;padding:11px 18px;border-radius:999px;border:1px solid #D9E0F2;background:#fff;color:#3A4466;cursor:pointer;transition:all .25s}
  .tab:hover{border-color:#9FB0E6}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 8px 22px rgba(0,26,173,.22)}
  .dept{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);margin-top:28px;align-items:stretch}
  .flowcard{background:linear-gradient(160deg,#001AAD,#0B2BD0 60%,#2563EB);border-radius:24px;padding:clamp(22px,2.6vw,34px);color:#fff;position:relative;overflow:hidden}
  .flowcard:before{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(16,203,255,.35),transparent 70%)}
  .flowcard .k{font:700 11px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
  .flowcard h3{font-size:clamp(19px,1.6vw,24px);margin-top:8px;line-height:1.3}
  .steps{list-style:none;margin-top:22px;position:relative}
  .steps:before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:2px;background:rgba(255,255,255,.18)}
  .st{position:relative;display:flex;align-items:center;gap:14px;padding:7px 0;opacity:.55;transition:opacity .35s}
  .st.on,.st.done{opacity:1}
  .st .n{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);z-index:1;transition:all .35s}
  .st .n svg{width:17px;height:17px}
  .st.on .n{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 6px rgba(16,203,255,.22);color:#00163D}
  .st.done .n{background:rgba(16,203,255,.25);border-color:var(--cyan)}
  .st .tx{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.35}
  .st .who{flex:none;font:700 10px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.12)}
  .st .who.agent{background:rgba(16,203,255,.2);color:#BFF0FF}
  .st .who.human{background:#fff;color:var(--blue)}
  .flowcard .out{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.18);font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.88)}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
  .role{background:#fff;border:1px solid #E3E8F6;border-radius:18px;padding:20px;transition:transform .3s,box-shadow .3s}
  .role:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(16,30,90,.08)}
  .role .ri{width:38px;height:38px;border-radius:11px;background:#EEF2FF;display:grid;place-items:center;color:var(--blue)}
  .role .ri svg{width:19px;height:19px}
  .role h4{margin-top:14px;font-size:15.5px;color:var(--ink)}
  .role p{margin-top:6px;font-size:13.5px;line-height:1.55;color:#5A6482}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:#6B7490;font-weight:600}
  .legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px}
  .fade{animation:fadeup .45s ease both}
  @keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* Sơ đồ tổ chức */
  .orgsec{background:#fff;border-top:1px solid #E3E8F6;border-bottom:1px solid #E3E8F6}
  .org{margin-top:44px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start}
  .chart{position:relative;background:#F7F9FF;border:1px solid #E3E8F6;border-radius:24px;padding:28px 22px 26px}
  .chart .grid{background-image:radial-gradient(#D9E0F2 1px,transparent 1px);background-size:18px 18px;position:absolute;inset:0;border-radius:24px;opacity:.7;pointer-events:none}
  .ceo{position:relative;margin:0 auto;width:max-content;max-width:100%}
  .node{position:relative;background:#fff;border:1.5px solid #D9E0F2;border-radius:14px;padding:11px 14px;text-align:center;cursor:pointer;transition:all .25s;font:inherit;color:inherit;width:100%}
  .node:hover{border-color:#9FB0E6}
  .node.on{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,26,173,.1),0 12px 26px rgba(0,26,173,.12)}
  .node .nm{display:block;font-weight:700;font-size:13.5px;color:var(--ink);line-height:1.3}
  .node .ag{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font:700 10.5px 'JetBrains Mono',monospace;letter-spacing:.05em;color:var(--blue);background:#EEF5FF;border-radius:999px;padding:3px 8px}
  .node .ag i{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  .ceo .node{padding:13px 22px;background:var(--blue);border-color:var(--blue)}
  .ceo .node .nm{color:#fff}.ceo .node .ag{background:rgba(255,255,255,.15);color:#fff}
  .ceo .node.on{box-shadow:0 0 0 4px rgba(16,203,255,.35),0 12px 26px rgba(0,26,173,.25)}
  .hub{position:relative;margin:30px auto 0;width:max-content;max-width:100%;display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;background:linear-gradient(90deg,#001AAD,#2563EB);color:#fff;font:700 12px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 10px 24px rgba(0,26,173,.25)}
  .hub svg{width:14px;height:14px}
  .hub:before{content:"";position:absolute;left:50%;top:-30px;width:2px;height:30px;background:#C9D3EE}
  .hub:after{content:"";position:absolute;left:50%;bottom:-15px;width:2px;height:15px;background:#C9D3EE}
  .vline{position:absolute;left:50%;width:2px;background:#C9D3EE}
  .depts{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 14px;margin-top:30px}
  .depts:before{content:"";position:absolute;left:16.6%;right:16.6%;top:-15px;height:2px;background:#C9D3EE}
  .depts .cell{position:relative}
  .depts .cell:before{content:"";position:absolute;left:50%;top:-15px;width:2px;height:15px;background:#C9D3EE}
  .depts .cell:nth-child(n+4):before{display:none}
  .depts .cell:nth-child(n+4){margin-top:0}
  .pulse{position:absolute;width:8px;height:8px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);pointer-events:none;opacity:0}
  .detail{background:var(--ink);color:#fff;border-radius:24px;padding:clamp(22px,2.6vw,32px);position:sticky;top:24px}
  .detail .k{font:700 11px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
  .detail h3{font-size:clamp(20px,1.7vw,26px);margin-top:8px;line-height:1.25}
  .detail .pain{margin-top:10px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.72)}
  .detail ul{list-style:none;margin-top:18px;display:grid;gap:10px}
  .detail li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
  .detail li b{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--cyan);color:#00163D;font-size:11px;margin-top:1px}
  .detail .sol{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px}
  .detail .sol span{font:700 10.5px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.85)}

  /* Nền tảng: năng lực cốt lõi + triển khai */
  .caps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:40px}
  .cap{background:#fff;border:1px solid #E3E8F6;border-radius:18px;padding:22px}
  .cap .num{font:700 12px 'JetBrains Mono',monospace;color:#2563EB;letter-spacing:.08em}
  .cap h4{margin-top:10px;font-size:16px;color:var(--ink)}
  .cap p{margin-top:6px;font-size:13.5px;line-height:1.55;color:#5A6482}
  .deploy{margin-top:18px;border-radius:24px;padding:clamp(22px,3vw,36px);background:linear-gradient(120deg,#001AAD,#2563EB);color:#fff;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center}
  .deploy h3{font-size:clamp(20px,1.9vw,28px);line-height:1.25}
  .deploy p{margin-top:8px;color:rgba(255,255,255,.85);font-size:14.5px;line-height:1.6}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips span{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-weight:600;font-size:13.5px}

  .ctaend{padding:clamp(64px,8vw,110px) 0;text-align:center}
  .ctaend h2{margin:14px auto 0;max-width:20em}
  .ctaend .lead{margin:14px auto 0}
  .btn{display:inline-flex;align-items:center;gap:10px;margin-top:28px;background:var(--blue);color:#fff;text-decoration:none;padding:15px 26px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:0 12px 28px rgba(0,26,173,.25);transition:transform .2s}
  .btn:hover{transform:translateY(-2px)}
  .ctaend .contact{margin-top:18px;font-size:14px;color:#5A6482;font-weight:600}
  .foot{background:#05081A;color:rgba(255,255,255,.6);padding:26px 0;font-size:13px}
  .foot .wrapx{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  @media (max-width:1023px){
    .dept,.org{grid-template-columns:minmax(0,1fr)}
    .detail{position:relative;top:0}
    .caps{grid-template-columns:1fr 1fr}
    .deploy{grid-template-columns:1fr}
  }
  @media (max-width:640px){
    .roles,.caps{grid-template-columns:1fr}
    .tabs{flex-wrap:nowrap;overflow-x:auto;margin-left:calc(-1*var(--gx));margin-right:calc(-1*var(--gx));padding:0 var(--gx) 6px;scrollbar-width:none}
    .tab{flex:none}
    .lg{width:150px;margin:0 12px}
    .depts{grid-template-columns:1fr 1fr;gap:12px}

        roles: [['Agent Phân loại yêu cầu', 'Đọc nội dung, xác định nhu cầu và mức ưu tiên.'], ['Agent Soạn báo giá', 'Tạo báo giá theo mẫu, kiểm tra chiết khấu.'], ['Agent Chăm sóc', 'Nhắc lịch follow-up, gửi thông tin sau buổi gặp.'], ['Trợ lý sản phẩm', 'Trả lời câu hỏi sản phẩm từ kho tri thức.']] },
      en: { name: 'Sales & Service', flow: 'From customer request to quote', out: 'No request slips through; sales spends time with customers instead of paperwork.',
        steps: [['a', 'Capture requests from website, email, chat'], ['a', 'Classify and assign an owner'], ['a', 'Draft a quote from price list and template'], ['h', 'Team lead approves pricing'], ['s', 'Send to customer, update CRM']],
        roles: [['Request Triage Agent', 'Reads each request and sets intent and priority.'], ['Quote Agent', 'Builds quotes from templates and checks discounts.'], ['Follow-up Agent', 'Schedules follow-ups and sends meeting recaps.'], ['Product Assistant', 'Answers product questions from the knowledge base.']] } },
    { id: 'legal',
      vi: { name: 'Hành chính – Pháp chế', flow: 'Soạn và phê duyệt hợp đồng', out: 'Hợp đồng được soạn từ mẫu chuẩn, rà soát có căn cứ và không bị trễ hạn gia hạn.',
        steps: [['h', 'Phòng ban gửi yêu cầu hợp đồng'], ['a', 'Soạn bản thảo từ mẫu chuẩn'], ['a', 'Rà soát điều khoản, đánh dấu rủi ro'], ['h', 'Pháp chế và lãnh đạo phê duyệt'], ['s', 'Lưu trữ, nhắc hạn gia hạn']],
        roles: [['Agent Soạn hợp đồng', 'Điền thông tin vào mẫu, giữ đúng điều khoản chuẩn.'], ['Agent Rà soát', 'So bản thảo với mẫu, tóm tắt điểm khác biệt.'], ['Agent Công văn', 'Phân loại, đánh số và chuyển công văn đến.'], ['Agent Nhắc hạn', 'Theo dõi hạn hợp đồng, giấy phép, chứng từ.']] },
      en: { name: 'Admin & Legal', flow: 'Contract drafting and approval', out: 'Contracts start from approved templates, are reviewed with evidence and never miss a renewal date.',
        steps: [['h', 'Team requests a contract'], ['a', 'Draft from the approved template'], ['a', 'Review clauses, flag risks'], ['h', 'Legal and leadership approve'], ['s', 'Archive, remind renewal dates']],
        roles: [['Contract Drafting Agent', 'Fills templates while keeping standard clauses intact.'], ['Review Agent', 'Compares drafts with templates and summarizes changes.'], ['Correspondence Agent', 'Sorts, numbers and routes incoming documents.'], ['Deadline Agent', 'Tracks contract, license and document deadlines.']] } },
    { id: 'it',
      vi: { name: 'IT – Vận hành', flow: 'Cấp quyền truy cập hệ thống', out: 'Quyền được cấp đúng người, đúng lúc và thu hồi khi không còn cần, có nhật ký kiểm toán đầy đủ.',
        steps: [['h', 'Nhân viên gửi yêu cầu cấp quyền'], ['a', 'Kiểm tra chính sách theo vai trò'], ['h', 'Quản lý phê duyệt'], ['s', 'RPA tạo tài khoản trên hệ thống'], ['a', 'Ghi nhật ký, đặt lịch rà soát quyền']],
        roles: [['Agent Hỗ trợ IT', 'Tiếp nhận yêu cầu, hướng dẫn xử lý lỗi thường gặp.'], ['Agent Cấp quyền', 'Cấp và thu hồi quyền theo vai trò, có phê duyệt.'], ['Agent Đồng bộ dữ liệu', 'Đồng bộ dữ liệu giữa ERP, CRM và hệ thống nội bộ.'], ['Agent Giám sát', 'Theo dõi tác vụ tự động, cảnh báo khi có lỗi.']] },
      en: { name: 'IT & Operations', flow: 'System access provisioning', out: 'The right people get access at the right time and lose it when it is no longer needed, fully audited.',
        steps: [['h', 'Employee requests access'], ['a', 'Check role-based policy'], ['h', 'Manager approves'], ['s', 'RPA creates the account'], ['a', 'Log activity, schedule access review']],
        roles: [['IT Help Agent', 'Takes requests and walks users through common fixes.'], ['Access Agent', 'Grants and revokes role-based access with approval.'], ['Data Sync Agent', 'Keeps ERP, CRM and internal systems in sync.'], ['Monitoring Agent', 'Watches automated jobs and alerts on errors.']] } },
  ];

  // Sơ đồ tổ chức: Ban Giám đốc + 6 khối, mỗi khối gắn giải pháp trên AgentFlow
  const ORG = {
    ceo: { n: 3,
      vi: { name: 'Ban Giám đốc', pain: 'Cần nhìn toàn cảnh vận hành và ra quyết định nhanh, không phải chờ báo cáo tổng hợp thủ công.',
        items: ['Dashboard vận hành theo thời gian thực trên toàn doanh nghiệp', 'Phê duyệt nhiều cấp ngay trên điện thoại, có SLA nhắc hạn', 'Analytics & Audit: truy vết mọi quyết định của người và AI Agent'], sol: ['BPM', 'Task Management'] },
      en: { name: 'Board of Directors', pain: 'Needs a full view of operations and fast decisions, without waiting for manually compiled reports.',
        items: ['Real-time operations dashboard across the company', 'Multi-level approvals on mobile, with SLA reminders', 'Analytics & Audit: trace every decision by people and AI Agents'], sol: ['BPM', 'Task Management'] } },
    depts: {
      fin: { n: 4, sol: ['ERP', 'BPM'], vi: { pain: 'Khối lượng chứng từ lớn, đối chiếu thủ công giữa nhiều hệ thống, dễ sai sót cuối kỳ.', items: ['Bóc tách và đối chiếu hóa đơn, PO, biên nhận, hợp đồng (AutoMatching)', 'Chuyển ngoại lệ đúng người duyệt theo hạn mức', 'Đồng bộ bút toán vào ERP và báo cáo cuối ngày'] },
        en: { pain: 'High document volume and manual matching across systems lead to month-end errors.', items: ['Extract and match invoices, POs, receipts and contracts (AutoMatching)', 'Route exceptions to the right approver by limit', 'Sync entries to ERP and send end-of-day reports'] } },
      hr: { n: 4, sol: ['HRM', 'Task Management'], vi: { pain: 'Tuyển dụng, onboarding và nghỉ phép đi qua nhiều phòng ban, dễ sót bước.', items: ['Sàng lọc CV và lên lịch phỏng vấn', 'Onboarding tự động giữa HR, IT và quản lý', 'Trợ lý hỏi đáp quy chế nội bộ có trích dẫn nguồn (Ragify)'] },
        en: { pain: 'Hiring, onboarding and leave span many teams, so steps get missed.', items: ['Screen CVs and schedule interviews', 'Automated onboarding across HR, IT and managers', 'Policy Q&A assistant with cited sources (Ragify)'] } },
      buy: { n: 4, sol: ['ERP', 'BPM'], vi: { pain: 'Đề xuất mua hàng chờ duyệt lâu, khó theo dõi ngân sách và tiến độ giao hàng.', items: ['Kiểm tra ngân sách và chính sách trước khi trình duyệt', 'Phê duyệt nhiều cấp theo hạn mức, có SLA', 'Tạo PO và theo dõi giao nhận tới thanh toán'] },
        en: { pain: 'Purchase requests wait for approval while budget and delivery are hard to track.', items: ['Check budget and policy before routing for approval', 'Multi-level approval by limit, with SLAs', 'Create POs and track delivery through to payment'] } },
      sales: { n: 4, sol: ['CRM'], vi: { pain: 'Yêu cầu đến từ nhiều kênh, phản hồi chậm, dữ liệu khách hàng rời rạc.', items: ['Gom yêu cầu từ website, email, chat về một nơi', 'Soạn báo giá theo mẫu, duyệt giá trong luồng', 'Nhắc follow-up và cập nhật CRM tự động'] },
        en: { pain: 'Requests arrive from many channels, replies are slow and customer data is scattered.', items: ['Bring website, email and chat requests into one place', 'Draft quotes from templates, approve pricing in-flow', 'Automated follow-ups and CRM updates'] } },
      legal: { n: 4, sol: ['BPM', 'Task Management'], vi: { pain: 'Hợp đồng và công văn xử lý bằng tay, khó kiểm soát phiên bản và thời hạn.', items: ['Soạn hợp đồng từ mẫu chuẩn và rà soát điều khoản', 'Phân loại, đánh số và chuyển công văn đến', 'Nhắc hạn hợp đồng, giấy phép, chứng từ'] },
        en: { pain: 'Contracts and correspondence are handled manually, versions and deadlines slip.', items: ['Draft contracts from templates and review clauses', 'Sort, number and route incoming correspondence', 'Remind contract, license and document deadlines'] } },
      it: { n: 4, sol: ['BPM'], vi: { pain: 'Nhiều hệ thống rời rạc, cấp quyền và đồng bộ dữ liệu tốn công, khó kiểm toán.', items: ['Cấp và thu hồi quyền theo vai trò, có phê duyệt', 'Tích hợp API, MCP, RPA, database, SSO', 'Giám sát tác vụ tự động và nhật ký kiểm toán'] },
        en: { pain: 'Many disconnected systems make access and data sync costly and hard to audit.', items: ['Grant and revoke role-based access with approval', 'Integrate via API, MCP, RPA, database and SSO', 'Monitor automated jobs with a full audit trail'] } },
    },
  };

  const CAPS = {
    vi: [['Visual Process Designer', 'Thiết kế quy trình kéo thả, no-code / low-code.'], ['Workflow Engine', 'Tuần tự, song song, rẽ nhánh, phê duyệt nhiều cấp.'], ['AI Agents', 'Phân loại, tóm tắt, trích xuất, đề xuất trong từng bước.'], ['Human Task & Approval', 'Giao việc cho người, theo dõi SLA, AI with Human-in-the-Loop.'], ['Enterprise Integration', 'Kết nối API, MCP, RPA, database và SSO.'], ['Analytics & Audit', 'Theo dõi trạng thái, ngoại lệ và lịch sử xử lý tập trung.']],
    en: [['Visual Process Designer', 'Drag-and-drop process design, no-code / low-code.'], ['Workflow Engine', 'Sequential, parallel, branching, multi-level approvals.'], ['AI Agents', 'Classify, summarize, extract and recommend at every step.'], ['Human Task & Approval', 'Assign work to people with SLAs, AI with Human-in-the-Loop.'], ['Enterprise Integration', 'Connect via API, MCP, RPA, database and SSO.'], ['Analytics & Audit', 'Track status, exceptions and history in one place.']],
  };

  let deptIdx = 0, orgSel = 'ceo', orgTouched = false, flowTimer = null, orgTimer = null;

  function renderSections() {
    const T = TEXT[lang];
    // logo: nhân đôi danh sách để dải chạy liền mạch
    const one = LOGOS.map(l => `<div class="lg">${l}</div>`).join('');
    $('track').innerHTML = one + one + one + one;
    $('stats').innerHTML = T.stats.map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');
    $('tabs').innerHTML = DEPTS.map((d, i) => `<button class="tab${i === deptIdx ? ' on' : ''}" role="tab" data-i="${i}">${d[lang].name}</button>`).join('');
    renderDept();
    renderOrg();
    $('caps').innerHTML = CAPS[lang].map(([h, p], i) => `<div class="cap"><div class="num">${String(i + 1).padStart(2, '0')}</div><h4>${h}</h4><p>${p}</p></div>`).join('');
    $('chips').innerHTML = T.chips.map(c => `<span>${c}</span>`).join('');
  }

  function renderDept() {
    const T = TEXT[lang], D = DEPTS[deptIdx][lang];
    const kind = { a: 'agent', h: 'human', s: 'system' };
    document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('on', i === deptIdx));
    $('dept').innerHTML = `
      <div class="flowcard fade">
        <div class="k">${T.flowK}</div><h3>${D.flow}</h3>
        <ol class="steps">${D.steps.map(([k, t]) => `<li class="st"><span class="n">${IC[kind[k]]}</span><span class="tx">${t}</span><span class="who ${kind[k]}">${T.who[kind[k]]}</span></li>`).join('')}</ol>
        <div class="out"><b>${T.outK}:</b> ${D.out}</div>
      </div>
      <div class="fade">
        <div class="roles">${D.roles.map(([h, p]) => `<div class="role"><div class="ri">${IC.agent}</div><h4>${h}</h4><p>${p}</p></div>`).join('')}</div>
        <div class="legend"><span><i style="background:#10CBFF"></i>${T.legend[0]}</span><span><i style="background:#001AAD"></i>${T.legend[1]}</span><span><i style="background:#9FB0E6"></i>${T.legend[2]}</span></div>
      </div>`;
    playFlow();
  }

  // các bước trong quy trình sáng lần lượt, lặp lại
  function playFlow() {
    clearInterval(flowTimer);
    const st = [...document.querySelectorAll('#dept .st')];
    let k = 0;
    const tick = () => {
      st.forEach((el, i) => { el.classList.toggle('done', i < k); el.classList.toggle('on', i === k) });
      k = k >= st.length + 1 ? 0 : k + 1;
    };
    tick();
    if (!reduce) flowTimer = setInterval(tick, 1100);
  }

  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    deptIdx = +b.dataset.i; renderDept();
  });

  function renderOrg() {
    const T = TEXT[lang];
    const C = ORG.ceo;
    $('ceo').innerHTML = `<button class="node${orgSel === 'ceo' ? ' on' : ''}" data-id="ceo"><span class="nm">${C[lang].name}</span><span class="ag"><i></i>${T.agentsN(C.n)}</span></button>`;
    $('depts').innerHTML = DEPTS.map(d => `<div class="cell"><button class="node${orgSel === d.id ? ' on' : ''}" data-id="${d.id}"><span class="nm">${d[lang].name}</span><span class="ag"><i></i>${T.agentsN(ORG.depts[d.id].n)}</span></button></div>`).join('');
    renderDetail();
  }
  function renderDetail() {
    const T = TEXT[lang];
    let name, x, sol;
    if (orgSel === 'ceo') { x = ORG.ceo[lang]; name = x.name; sol = x.sol }
    else { const o = ORG.depts[orgSel]; x = o[lang]; name = DEPTS.find(d => d.id === orgSel)[lang].name; sol = o.sol }
    document.querySelectorAll('#chart .node').forEach(n => n.classList.toggle('on', n.dataset.id === orgSel));
    $('detail').innerHTML = `<div class="fade"><div class="k">AgentFlow ×</div><h3>${name}</h3><p class="pain">${x.pain}</p>
      <ul>${x.items.map((t, i) => `<li><b>${i + 1}</b><span>${t}</span></li>`).join('')}</ul>
      <div class="k" style="margin-top:18px">${T.solK}</div><div class="sol">${sol.map(s => `<span>${s}</span>`).join('')}</div></div>`;
  }
  $('chart').addEventListener('click', e => {
    const n = e.target.closest('.node'); if (!n) return;
    orgTouched = true; clearInterval(orgTimer);
    orgSel = n.dataset.id; renderDetail();
  });
  // tự chuyển lần lượt các khối cho tới khi người xem tự bấm
  const ORDER = ['ceo', ...DEPTS.map(d => d.id)];
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) orgTimer = setInterval(() => {
    if (orgTouched) return;
    const r = $('org').getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) return;
    orgSel = ORDER[(ORDER.indexOf(orgSel) + 1) % ORDER.length]; renderDetail();
  }, 4500);

  function applyText() {
    const T = TEXT[lang];
    document.documentElement.lang = lang;
    $('menu').innerHTML = T.menu.map(m => `<li>${m}</li>`).join('');
    document.querySelectorAll('[data-k]').forEach(el => { el.textContent = T[el.dataset.k] });
    renderSections();
    $('b-vi').classList.toggle('on', lang === 'vi');
    $('b-en').classList.toggle('on', lang === 'en');
    resetFeed();
    update();
  }
  $('b-vi').onclick = () => { lang = 'vi'; applyText() };
  $('b-en').onclick = () => { lang = 'en'; applyText() };


  // ===== chuyển ngày -> đêm theo vị trí cuộn =====
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t) };
  // ?p=0..1 cố định tiến độ (dùng khi xuất ảnh minh hoạ)
  const FORCED = new URLSearchParams(location.search).get('p');
  function progress() {
    if (FORCED !== null) return clamp(+FORCED);
    const r = $('wrap').getBoundingClientRect();
    return clamp(-r.top / (r.height - innerHeight));
  }
  function update() {
    const p = progress();
    const e = smooth(.12, .88, p);                 // giữ ngày ở đầu, giữ đêm ở cuối
    $('night').style.opacity = e;
    // đồng hồ chạy từ 09:30 tới 23:00
    const mins = Math.round((570 + (1380 - 570) * e) / 5) * 5;
    const h = Math.floor(mins / 60), m = mins % 60;
    const ap = h < 12 ? 'AM' : 'PM';
    const hh = lang === 'en' ? ((h + 11) % 12) + 1 : h;
    $('clock').innerHTML = `${String(hh).padStart(2, '0')}:${String(m).padStart(2, '0')}<small>${ap}</small>`;
    // người về: thẻ việc ban ngày mờ dần, thẻ "đã về" hiện lên
    // mờ hẳn bản ngày rồi mới hiện bản đêm, tránh hai nhãn chồng lên nhau
    const out = smooth(.36, .48, e), inn = smooth(.5, .62, e);
    $('humanDay').style.opacity = 1 - out;
    $('humanNight').style.opacity = inn;
    $('agentDay').style.opacity = 1 - out;
    $('agentNight').style.opacity = inn;
    $('hint').style.opacity = 1 - smooth(0, .15, p);
  }
  addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
  addEventListener('resize', () => update());

  // ===== dòng việc AI Agent chạy liên tục =====
  const RUN = 1800, HOLD = 550, VISIBLE = 4;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let next = 0, timer = null;
  function row(state) {
    const T = TEXT[lang].tasks;
    const el = document.createElement('div');
    el.className = 'tk ' + state;
    el.innerHTML = `<span class="t">${T[next % T.length]}</span><span class="cb"></span><span class="bar"></span>`;
    el.style.setProperty('--d', RUN + 'ms');
    next++;
    return el;
  }
  function resetFeed() {
    clearTimeout(timer);
    const feed = $('feed');
    feed.innerHTML = '';
    next = 0;
    for (let i = 0; i < VISIBLE; i++) feed.appendChild(row(i === 0 ? 'queue' : 'queue'));
    if (reduce) { feed.firstChild.className = 'tk run'; return }
    timer = setTimeout(cycle, 400);
  }
  function cycle() {
    const feed = $('feed');
    const first = feed.firstElementChild;
    first.className = 'tk run';                     // thanh tiến độ chạy
    timer = setTimeout(() => {
      first.className = 'tk done';
      first.querySelector('.cb').textContent = '✓';
      timer = setTimeout(() => {
        first.classList.add('leave');               // thu gọn hàng đã xong
        const n = row('queue enter');
        feed.appendChild(n);
        n.getBoundingClientRect();                  // ép trình duyệt tính layout để hiệu ứng trượt vào chạy
        n.classList.remove('enter');
        timer = setTimeout(() => { first.remove(); cycle() }, 460);
      }, HOLD);
    }, RUN);
  }
  // tạm dừng khi tab ẩn để vòng lặp không dồn
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(timer); else resetFeed() });

  applyText();
</script>
</body>
